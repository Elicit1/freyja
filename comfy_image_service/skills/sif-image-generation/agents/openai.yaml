interface:
  display_name: "SIF Image Generation"
  short_description: "Generate images or edit with up to 16 references through SIF"
  default_prompt: "Use $sif-image-generation with English prompts, an API key on every request, and event-backed wait_for_job. Default to fast, 2K and 16:9 for t2i, preserving the first reference ratio for i2i, with prompt expansion OFF. Support ordered references and requested custom canvases up to 20 MP."
