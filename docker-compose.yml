services:
  # ============================================================================
  # 1. 关系型数据库：MySQL 8.0 (自动执行 init.sql 初始化表结构与基础字典/配置数据)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: freyja-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: freyja
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - freyja-network

  # ============================================================================
  # 2. 内存缓存与任务队列：Redis 7.0
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: freyja-redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD:-123456}\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - freyja-network

  # ============================================================================
  # 3. 对象存储：MinIO (存储分镜产物、角色设定图与媒体资产)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: freyja-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - freyja-network

  # ============================================================================
  # 4. ComfyUI 网关：FastAPI 兼容层 (解耦生图/生视频模型与外部宿主 ComfyUI)
  # ============================================================================
  comfy-gateway:
    build:
      context: ./comfy_gateway
      dockerfile: Dockerfile
    container_name: freyja-comfy-gateway
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      COMFYUI_HTTP_URL: ${COMFYUI_HTTP_URL:-http://host.docker.internal:8188}
      COMFYUI_WS_URL: ${COMFYUI_WS_URL:-ws://host.docker.internal:8188/ws}
      BASE_URL: ${GATEWAY_BASE_URL:-http://localhost:8000}
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - gateway_outputs:/app/static/outputs
    restart: unless-stopped
    networks:
      - freyja-network

  # ============================================================================
  # 5. 后端核心服务：Spring Boot 4 (JDK 26 + 内置 FFmpeg)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freyja-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/freyja?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: video-assets
      FREYJA_MEDIA_TOOLS_FFMPEG_PATH: ffmpeg
      FREYJA_MEDIA_TOOLS_FFPROBE_PATH: ffprobe
      FREYJA_CRYPTO_KEY: ${FREYJA_CRYPTO_KEY:-freyja-local-dev-key-please-change-me-0123456789}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms512m -Xmx2048m -XX:+UseG1GC}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
      - ./skills:/app/skills:ro
    restart: unless-stopped
    networks:
      - freyja-network

  # ============================================================================
  # 6. 前端 Web 工作台：Vue 3 + Vite + Element Plus (由 Nginx 托管)
  # ============================================================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: freyja-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - freyja-network

networks:
  freyja-network:
    name: freyja-network
    driver: bridge

volumes:
  mysql_data:
    name: freyja-mysql-data
  redis_data:
    name: freyja-redis-data
  minio_data:
    name: freyja-minio-data
  gateway_outputs:
    name: freyja-gateway-outputs
  backend_logs:
    name: freyja-backend-logs
