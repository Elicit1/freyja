server {
    listen 80;
    server_name localhost;

    # 网络与 I/O 性能优化 (提升大文件上传与媒体下载吞吐)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 全局请求体大小限制放宽 (默认仅 1M，改为 500M 满足音色、高清视频、模型资产与 ZIP 技能包上传)
    client_max_body_size 500m;
    client_body_buffer_size 256k;
    client_body_timeout 300s;

    # 开启 Gzip 压缩，加快前端资源加载 (避免对音视频等大文件重复压缩)
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # 前端单页应用静态托管 (HTML 入口文件不缓存，确保版本更新瞬时生效)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资产长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 后端 RESTful API 代理转发 (末尾斜杠会自动剔除 /api/ 前缀)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 传输大文件与长时间 AI 渲染/处理超时时间
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 大文件/视频下载缓冲优化
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        proxy_max_temp_file_size 1024m;

        # 禁用针对流式大文件传输的 chunked 编码缓存截断
        proxy_http_version 1.1;
    }

    # WebSocket 实时通信代理
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 错误页面定向
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
