node_id: "default"
name: "RTX 4080 主机节点"
enabled: true
http_url: "http://127.0.0.1:8188"
ws_url: "ws://127.0.0.1:8188/ws"
timeout_seconds: 1800

models:
  - model_name: "flux-2-klein-9b"
    description: "FLUX.2 Klein 9B (UNETLoader fp8_e4m3fn + Qwen3 8B CLIP + Flux2 VAE)"
    template_file: "comfyUIApi/flux2_klein_9b_t2i_r3.json"
    handler: "flux2_reference_chain"
    default_steps: 4
    default_cfg: 1.0
    mappings:
      prompt: ["4", "inputs", "text"]
      negative_prompt: ["5", "inputs", "text"]
      width: ["6", "inputs", "width"]
      height: ["6", "inputs", "height"]
      seed: ["7", "inputs", "seed"]
      steps: ["7", "inputs", "steps"]
      cfg: ["7", "inputs", "cfg"]
      unet_name: ["10", "inputs", "unet_name"]
      clip_name: ["2", "inputs", "clip_name"]
      vae_name: ["3", "inputs", "vae_name"]
    handler_config:
      vae_node_id: "3"
      sampler_node_id: "7"
      sampler_cond_param: "positive"
      base_conditioning_source: ["4", 0]
      reference_node_type: "ReferenceLatent"

  - model_name: "minimax-h3-fl2va"
    description: "MiniMax H3 16GB HiFi (First/Last Frame to Video+Audio, FL2VA-Fast)"
    template_file: "comfyUIApi/minimax_h3_fl2va_fast.json"
    handler: "minimax_h3_fl2va"
    h3_extensions:
      continuation: true
      context_windows: true
      control_net: true
      context_windows_with_control_net: false
      control_version: '2.0'
      control_patch: minimax_h3_fun_controlnet_union_2.0_pruned_int8_convrot.safetensors
      model_output:
        id: '144'
        class_type: EasyCache
      conditioning:
        id: '136'
        class_type: MiniMaxH3ImageToVideo
      video_vae:
        id: '119'
        class_type: VAELoader
      audio_vae:
        id: '120'
        class_type: VAELoader
      model_consumers:
      - id: '124'
        class_type: BasicScheduler
        input: model
      - id: '126'
        class_type: BasicGuider
        input: model
      conditioning_consumers:
      - id: '126'
        class_type: BasicGuider
        input: conditioning
      preprocessors:
        CANNY:
          class_type: Canny
          inputs:
            low_threshold: 0.4
            high_threshold: 0.8
        POSE:
          class_type: DWPreprocessor
          inputs:
            detect_hand: enable
            detect_body: enable
            detect_face: enable
            resolution: 512
            bbox_detector: yolox_l.onnx
            pose_estimator: dw-ll_ucoco_384.onnx
        DEPTH:
          class_type: DepthAnythingV2Preprocessor
          inputs:
            ckpt_name: depth_anything_v2_vitl.pth
            resolution: 512
        HED:
          class_type: HEDPreprocessor
          inputs:
            safe: enable
            resolution: 512
        MLSD:
          class_type: M-LSDPreprocessor
          inputs:
            score_threshold: 0.1
            dist_threshold: 0.1
            resolution: 512
        SCRIBBLE:
          class_type: FakeScribblePreprocessor
          inputs:
            safe: enable
            resolution: 512
      prepared_control_types:
      - LAYOUT
      - PREPARED
    default_steps: 20
    default_cfg: 1.0
    timeout_seconds: 1800
    mappings:
      prompt: ["136", "inputs", "prompt"]
      width: ["136", "inputs", "width"]
      height: ["136", "inputs", "height"]
      length: ["136", "inputs", "length"]
      seed: ["129", "inputs", "noise_seed"]
