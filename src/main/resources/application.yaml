spring:
  application:
    name: freyja
  ai:
    mcp:
      server:
        # Keep transport infrastructure available; the runtime gate defaults off and can be managed in the UI.
        enabled: true
        protocol: STATELESS
        type: SYNC
        name: freyja-digital-studio
        version: 1.0.0
        request-timeout: 300s
        instructions: "Generate all non-prompt text in Simplified Chinese: names, titles, genres, summaries, descriptions, biographies, look design descriptions, scripts, actions, dialogue, voiceover, sound descriptions, user-facing explanations and completion summaries. Prompt fields follow the relevant Skill/model/user language requirements and preserve original-language dialogue. Keep JSON field names, enum codes, IDs, URLs, technical identifiers and existing creator-authored text unchanged. Apply this rule even when Skills show English non-prompt examples. Discover list_skills at creation start and whenever the task stage changes; select by descriptions and read_skill/read_skill_file before generating. Character/character-look design images use character-sheet-design: when requested, one canvas holds front/side/back full-body views, separate head portraits and detail close-ups; respect explicit user layout, style and background. Transparent means real PNG alpha with the image tool transparency option, not a painted checkerboard; white is an alternative when allowed. Before MiniMax H3 writing, read h3-prompt-writing and references/base-en.txt for three-section FIRST_LAST_FRAME videoPrompt or references/ref-en.txt for six-section REFERENCE_MODE prompt. Creating a project requires an explicit enabled aspectRatio: read drama_aspect_ratio options and ask the user when unspecified; only if the user delegates the choice to AI, prefer enabled 16:9. Preserve existing project ratios. Project genre is free text up to 64 characters; drama_genre gives suggestions, other enums follow their field constraints. When creating shots, follow script-decomposition pacing: split by story needs and meaningful narrative turns, then estimate duration from complete action and dialogue at natural speed. Keep preparation, execution and result under one goal in one shot where possible. AUTO favors compact natural performances, often 3-5 seconds for ordinary complete actions, with shorter reactions and longer dialogue/actions as needed; creator pacing ranges are references only. Use 7-8 seconds as a comfortable long-shot rendering reference. When an estimated shot exceeds 8 seconds, actively split at complete action boundaries, dialogue turns or meaningful narrative beats where continuity permits to reduce rendering pressure; avoid excessive fragmentation and keep one continuous action intact where possible. Preserve explicit creator requests for longer takes. Never pad or stretch shots to fit fixed duration buckets or target episode runtime. Parallel actions share time; environment and held-object states add no time. Do not invent pauses, slow motion or safety buffers. Preserve original dialogue, speed and creative choices; handle exact model limits separately during rendering. Scene fields are optional: sceneType accepts INDOOR/OUTDOOR/STUDIO/VIRTUAL (riversides and streets use OUTDOOR), timeOfDay accepts DAY/NIGHT/SUNSET/DAWN; there is no default type or DAY. Omitted story-scene fields may inherit a linked resource scene; explicit null stays empty and omitted update fields preserve existing values. Explicitly choose generationMode: REFERENCE_MODE uses prompt plus ordered refImages and optional refAudios; FIRST_LAST_FRAME uses videoPrompt plus firstFramePrompt/endFramePrompt or previewImageUrl/endFrameImageUrl. Generate video prompts without background music or score for clean editing: in both modes keep non_diegetic_music and explicitly write none / no background music; overall_soundscape contains only dialogue, natural ambience and necessary sound effects, and refAudios must not introduce BGM. This application requirement takes precedence over Skill music examples. Draft defaults are FIRST_LAST_FRAME and 3 seconds; explicitly estimate duration for finished shots. After writes read back key records using get_scene/get_resource_scene/get_shot or batch_read_records and compare sceneType/timeOfDay, duration, generationMode, prompt/media fields and character/look references to creative intent; correct differences using a fresh editFingerprint before rendering. Fill complete storyboard specifications and asset associations; AUTO is allowed for shotType/cameraMovement with locks false. Use imageUrl/sourceType/sourceId in refImages; CHARACTER_LOOK uses a look ID and characterId. Single/batch image uploads return URLs, never print Base64. DirectorPlan remains optional. Internal AI/model execution and system templates remain private. Business IDs are strings. Preserve creator locks and fingerprints. Read freyja://guide for the full workflow. Refresh tools/list after configuration changes."
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: true
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
  mvc:
    async:
      request-timeout: 600000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/freyja?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 5s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}

freyja:
  mcp:
    enabled: ${FREYJA_MCP_ENABLED:false}
    token: ${FREYJA_MCP_TOKEN:}
    write-enabled: ${FREYJA_MCP_WRITE_ENABLED:false}
    allow-all-projects: ${FREYJA_MCP_ALLOW_ALL_PROJECTS:false}
    allow-create-projects: ${FREYJA_MCP_ALLOW_CREATE_PROJECTS:false}
    allowed-project-ids: ${FREYJA_MCP_ALLOWED_PROJECT_IDS:}
    allowed-origins: ${FREYJA_MCP_ALLOWED_ORIGINS:}
  crypto:
    key: ${FREYJA_CRYPTO_KEY:freyja-local-dev-key-please-change-me-0123456789}
  media-tools:
    ffmpeg-path: ${FREYJA_MEDIA_TOOLS_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FREYJA_MEDIA_TOOLS_FFPROBE_PATH:ffprobe}
    timeout: 30s
  render:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
      thread-name-prefix: render-async-

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:video-assets}

logging:
  file:
    path: ./logs
  level:
    com.astra.freyja: debug
    com.astra.freyja.dao: debug

story:
  decomposition:
    minSegmentCharacters: 1200
    targetSegmentCharacters: 2000
    maxSegmentCharacters: 3500

ai:
  planner:
    concurrency: 1
  shotWorker:
    maxConcurrency: 3
    timeoutSeconds: 180
    maxRetries: 2

shot:
  duration:
    shortThreshold: 4
    fragmentationWarningRatio: 0.30

