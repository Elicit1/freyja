spring:
  application:
    name: freyja
  ai:
    mcp:
      server:
        enabled: ${freyja.mcp.enabled:false}
        protocol: STATELESS
        type: SYNC
        name: freyja-digital-studio
        version: 1.0.0
        instructions: "FREYJA business operations only. Internal agents, model execution, prompts and skills are not exposed. All business IDs are strings. Read current data before editing and preserve creator locks."
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: true
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
  mvc:
    async:
      request-timeout: 600000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/freyja?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}

freyja:
  mcp:
    enabled: ${FREYJA_MCP_ENABLED:false}
    token: ${FREYJA_MCP_TOKEN:}
    write-enabled: ${FREYJA_MCP_WRITE_ENABLED:false}
    allow-all-projects: ${FREYJA_MCP_ALLOW_ALL_PROJECTS:false}
    allow-create-projects: ${FREYJA_MCP_ALLOW_CREATE_PROJECTS:false}
    allowed-project-ids: ${FREYJA_MCP_ALLOWED_PROJECT_IDS:}
    allowed-origins: ${FREYJA_MCP_ALLOWED_ORIGINS:}
  crypto:
    key: ${FREYJA_CRYPTO_KEY:freyja-local-dev-key-please-change-me-0123456789}
  media-tools:
    ffmpeg-path: ${FREYJA_MEDIA_TOOLS_FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FREYJA_MEDIA_TOOLS_FFPROBE_PATH:ffprobe}
    timeout: 30s
  render:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
      thread-name-prefix: render-async-

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:video-assets}

logging:
  file:
    path: ./logs
  level:
    com.astra.freyja: debug
    com.astra.freyja.dao: debug

story:
  decomposition:
    minSegmentCharacters: 1200
    targetSegmentCharacters: 2000
    maxSegmentCharacters: 3500

ai:
  planner:
    concurrency: 1
  shotWorker:
    maxConcurrency: 3
    timeoutSeconds: 180
    maxRetries: 2

shot:
  duration:
    shortThreshold: 4
    fragmentationWarningRatio: 0.30

